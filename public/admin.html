<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Key Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0d12;
      color: white;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 750px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: #151820;
      border: 1px solid #292e39;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 9px;
      font-size: 15px;
    }

    input {
      background: #0e1117;
      color: white;
      border: 1px solid #343a47;
      outline: none;
    }

    button {
      border: 0;
      background: #5275ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .key-card {
      background: #0e1117;
      border: 1px solid #292e39;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .active {
      background: #12351f;
      color: #63ff96;
    }

    .expired {
      background: #382b12;
      color: #ffc857;
    }

    .revoked {
      background: #391719;
      color: #ff7777;
    }

    .info {
      color: #9ca3af;
      font-size: 13px;
      margin-top: 7px;
    }

    .danger {
      background: #b83232;
    }

    .delete {
      background: #444b59;
    }

    #message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block !important;
      background: #12351f;
      color: #63ff96;
    }

    .error {
      display: block !important;
      background: #391719;
      color: #ff7777;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔐 Key Admin Panel</h1>

  <!-- ADMIN LOGIN -->
  <div class="card">

    <h2>Admin Login</h2>

    <input
      type="password"
      id="adminPassword"
      placeholder="Admin Password"
    >

    <button onclick="loginAdmin()">
      LOGIN
    </button>

    <div id="message"></div>

  </div>


  <!-- CREATE KEY -->
  <div class="card">

    <h2>Create Key</h2>

    <input
      type="text"
      id="newKey"
      placeholder="Enter key"
    >

    <input
      type="number"
      id="expiryDays"
      value="1"
      min="1"
      placeholder="Expiry days"
    >

    <button onclick="createKey()">
      CREATE KEY
    </button>

  </div>


  <!-- KEYS -->
  <div class="card">

    <h2>Keys</h2>

    <div id="keys">
      Login first to load keys.
    </div>

  </div>

</div>


<script>

let adminPassword = "";


/* MESSAGE */
function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.textContent = text;
  message.className = type;

}


/* ADMIN LOGIN */
async function loginAdmin() {

  adminPassword =
    document.getElementById("adminPassword").value.trim();

  if (!adminPassword) {

    showMessage(
      "Enter admin password.",
      "error"
    );

    return;
  }

  await loadKeys();
}


/* LOAD KEYS */
async function loadKeys() {

  try {

    const response = await fetch("/api/keys", {

      headers: {
        "x-admin-password": adminPassword
      }

    });

    const data = await response.json();

    if (!response.ok) {

      showMessage(
        data.error || "Login failed.",
        "error"
      );

      return;
    }

    showMessage(
      "Admin login successful.",
      "success"
    );

    displayKeys(data.keys || []);

  } catch (error) {

    showMessage(
      "Server connection failed.",
      "error"
    );

  }
}


/* CREATE KEY */
async function createKey() {

  if (!adminPassword) {

    showMessage(
      "Login as admin first.",
      "error"
    );

    return;
  }

  const key =
    document.getElementById("newKey").value.trim();

  let days =
    Number(
      document.getElementById("expiryDays").value
    );

  if (!key) {

    showMessage(
      "Enter a key.",
      "error"
    );

    return;
  }

  if (!days || days < 1) {
    days = 1;
  }

  try {

    const response = await fetch("/api/keys", {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "x-admin-password": adminPassword
      },

      body: JSON.stringify({
        key: key,
        days: days
      })

    });

    const data = await response.json();

    if (!response.ok) {

      showMessage(
        data.error || "Failed to create key.",
        "error"
      );

      return;
    }

    showMessage(
      `Key created for ${days} day(s).`,
      "success"
    );

    document.getElementById("newKey").value = "";

    await loadKeys();

  } catch (error) {

    showMessage(
      "Server connection failed.",
      "error"
    );

  }
}


/* DISPLAY KEYS */
function displayKeys(keys) {

  const container =
    document.getElementById("keys");

  if (!keys.length) {

    container.innerHTML =
      "<p>No keys available.</p>";

    return;
  }

  container.innerHTML = "";

  keys.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "key-card";

    const created =
      formatDate(item.createdAt);

    const expires =
      item.expiresAt
        ? formatDate(item.expiresAt)
        : "No expiry";

    let statusClass = "active";

    if (item.status === "Expired") {
      statusClass = "expired";
    }

    if (item.status === "Revoked") {
      statusClass = "revoked";
    }

    card.innerHTML = `

      <strong>Key ID:</strong>
      <div class="info">
        ${item.id}
      </div>

      <div class="status ${statusClass}">
        ${item.status}
      </div>

      <div class="info">
        Created: ${created}
      </div>

      <div class="info">
        Expires: ${expires}
      </div>

      <button
        class="danger"
        onclick="revokeKey('${item.id}')"
        ${item.status !== "Active" ? "disabled" : ""}
      >
        REVOKE
      </button>

      <button
        class="delete"
        onclick="deleteKey('${item.id}')"
      >
        DELETE
      </button>

    `;

    container.appendChild(card);

  });

}


/* REVOKE */
async function revokeKey(id) {

  if (!confirm("Revoke this key?")) {
    return;
  }

  try {

    const response = await fetch(
      `/api/keys/${id}/revoke`,
      {
        method: "POST",
        headers: {
          "x-admin-password": adminPassword
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {

      showMessage(
        data.error || "Failed.",
        "error"
      );

      return;
    }

    showMessage(
      "Key revoked.",
      "success"
    );

    await loadKeys();

  } catch (error) {

    showMessage(
      "Server connection failed.",
      "error"
    );

  }
}


/* DELETE */
async function deleteKey(id) {

  if (!confirm("Delete this key permanently?")) {
    return;
  }

  try {

    const response = await fetch(
      `/api/keys/${id}`,
      {
        method: "DELETE",
        headers: {
          "x-admin-password": adminPassword
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {

      showMessage(
        data.error || "Failed.",
        "error"
      );

      return;
    }

    showMessage(
      "Key deleted.",
      "success"
    );

    await loadKeys();

  } catch (error) {

    showMessage(
      "Server connection failed.",
      "error"
    );

  }
}


/* DATE FORMAT */
function formatDate(timestamp) {

  if (!timestamp) {
    return "N/A";
  }

  return new Date(timestamp).toLocaleString();

}

</script>

</body>
</html>
