<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Key Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0d12;
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      background: #151820;
      border: 1px solid #292e39;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 15px 40px rgba(0,0,0,.45);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #8e96a5;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #343a47;
      background: #0e1117;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #5b7cff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: #5275ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block !important;
      background: #12351f;
      color: #6cff9b;
    }

    .error {
      display: block !important;
      background: #351719;
      color: #ff7777;
    }

    .admin {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #7f8cff;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🔐 Key Login</h1>

    <div class="subtitle">
      Enter your access key
    </div>

    <input
      type="text"
      id="key"
      placeholder="Enter your key"
      autocomplete="off"
    >

    <button onclick="login()">
      LOGIN
    </button>

    <div id="message"></div>

    <a class="admin" href="/admin.html">
      Admin Panel
    </a>

  </div>

  <script>
    async function login() {

      const key =
        document.getElementById("key").value.trim();

      const message =
        document.getElementById("message");

      if (!key) {
        message.textContent = "Please enter your key.";
        message.className = "error";
        return;
      }

      message.className = "";
      message.style.display = "block";
      message.textContent = "Checking key...";

      try {

        const response = await fetch("/api/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            key: key
          })

        });

        const data = await response.json();

        if (response.ok && data.success) {

          message.textContent =
            data.message || "Login successful!";

          message.className = "success";

        } else {

          message.textContent =
            data.error || "Invalid key.";

          message.className = "error";
        }

      } catch (error) {

        message.textContent =
          "Server connection failed.";

        message.className = "error";
      }
    }

    document.getElementById("key")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          login();
        }

      });
  </script>

</body>
</html>
